[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agiwiki"
version = "0.1.0a1"
description = "Experimental reference implementation for portable agent knowledge packs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "ORIGIN.md"]
authors = [{name = "shuchaoxi"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "jsonschema>=4.20,<5",
  "referencing>=0.35,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.28.1,<2"]
devloop = ["langgraph>=1.0,<2"]
dev = [
  "build>=1.2,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8,<10",
  "ruff==0.15.22",
  "twine>=6,<8",
]

[project.scripts]
agiwiki = "agiwiki.cli:main"
agiwiki-mcp = "agiwiki.mcp:main"

[project.urls]
Homepage = "https://github.com/shuchaoxi/AGIwiki"
Repository = "https://github.com/shuchaoxi/AGIwiki"
Issues = "https://github.com/shuchaoxi/AGIwiki/issues"
Changelog = "https://github.com/shuchaoxi/AGIwiki/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agiwiki = ["schemas/*.json"]

# Keep the repository-level `skills/` directories as the single source of
# truth. Wheels install the same files below the interpreter's data prefix;
# `agiwiki integration skill-path` discovers either this installed copy or an
# editable source checkout without modifying an Agent configuration.
[tool.setuptools.data-files]
"share/agiwiki/skills/agiwiki-memory" = [
  "skills/agiwiki-memory/SKILL.md",
]
"share/agiwiki/skills/agiwiki-memory/agents" = [
  "skills/agiwiki-memory/agents/openai.yaml",
]
"share/agiwiki/skills/agiwiki-author-memory" = [
  "skills/agiwiki-author-memory/SKILL.md",
]
"share/agiwiki/skills/agiwiki-author-memory/agents" = [
  "skills/agiwiki-author-memory/agents/openai.yaml",
]
"share/agiwiki/skills/agiwiki-author-memory/references" = [
  "skills/agiwiki-author-memory/references/authoring-contract.md",
]
"share/agiwiki/skills/agiwiki-critical-review" = [
  "skills/agiwiki-critical-review/SKILL.md",
]
"share/agiwiki/skills/agiwiki-critical-review/agents" = [
  "skills/agiwiki-critical-review/agents/openai.yaml",
]
"share/agiwiki/skills/agiwiki-critical-review/references" = [
  "skills/agiwiki-critical-review/references/review-contract.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 88
